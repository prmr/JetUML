plugins {
    id 'java'
    id 'application'
    id 'jacoco'
}

group 'com.jetuml'
version '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.openjfx:javafx-controls:17.0.9"
    implementation "org.openjfx:javafx-swing:17.0.9"
    implementation "org.openjfx:javafx-graphics:17.0.9"

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'ca.prmr.JetUML.JetUML'
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['src']
        }
    }
    test {
        java.srcDirs = ['test']
        resources.srcDirs = ['test']
    }
}


jacocoTestReport {
    dependsOn test
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}